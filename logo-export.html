<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How? Money Logo Export</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      height: 300px;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Arial Black", Impact, sans-serif;
      overflow: hidden;
    }

    .app-icon {
      width: 300px;
      height: 300px;
      background-color: #ffffff;
      border-radius: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .logo-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      text-align: center;
    }

    .line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
    }

    .balloon-text {
      font-size: 65px;
      color: #2563eb;
      letter-spacing: -1px;
      position: relative;
      display: inline-block;
      line-height: 1;
      text-shadow:
        1px 1px 0 #1e40af,
        2px 2px 0 #1e40af,
        3px 3px 0 #1e40af,
        4px 4px 0 #1d4ed8,
        5px 5px 8px rgba(0, 0, 0, 0.15);
    }

    .question-mark {
      transform: rotate(8deg);
      margin-left: 2px;
    }

    .w-money {
      position: relative;
      display: inline-block;
    }

    .w-money::before,
    .w-money::after {
      content: "";
      position: absolute;
      left: -8px;
      right: -8px;
      height: 6px;
      background: #2563eb;
      border-radius: 3px;
      z-index: 2;
      box-shadow:
        1px 1px 0 #1e40af,
        2px 2px 0 #1e40af;
    }

    .w-money::before { top: 38%; }
    .w-money::after { top: 53%; }

    .w-money span {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="app-icon">
    <div class="logo-content">
      <div class="line">
        <span class="balloon-text">H</span>
        <span class="balloon-text">O</span>
        <span class="balloon-text w-money"><span>W</span></span>
        <span class="balloon-text question-mark">?</span>
      </div>
      <div class="line">
        <span class="balloon-text">M</span>
        <span class="balloon-text">O</span>
        <span class="balloon-text">N</span>
        <span class="balloon-text">E</span>
        <span class="balloon-text">Y</span>
      </div>
    </div>
  </div>
</body>
</html>
